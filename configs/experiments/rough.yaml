experiment:
  name: rough
  description: Bezier-commanded quadruped navigation on rough terrain (subterrain grid via terrain.rough) with configurable difficulty.
environment:
  simulator:
    dt: 0.02
    substeps: 2
    max_collision_pairs: 320
  robot:
    urdf_path: assets/urdf/robots/go2/urdf/go2.urdf
    num_actions: 12
    joint_names:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
    default_joint_angles:
      FL_hip_joint: 0.0
      FR_hip_joint: 0.0
      RL_hip_joint: 0.0
      RR_hip_joint: 0.0
      FL_thigh_joint: 0.8
      FR_thigh_joint: 0.8
      RL_thigh_joint: 1.0
      RR_thigh_joint: 1.0
      FL_calf_joint: -1.5
      FR_calf_joint: -1.5
      RL_calf_joint: -1.5
      RR_calf_joint: -1.5
    base_init_pos: [0.0, 0.0, 0.42]
    base_init_quat: [1.0, 0.0, 0.0, 0.0]
    init_joint_noise_rad: 0.08
  control:
    mode: position_pd
    kp: 22.0
    kd: 0.7
    action_scale: 0.25
    clip_actions: 100.0
    simulate_action_latency: true
  observations:
    scales:
      projected_gravity: 1.0
      imu_gyro: 0.25
      cmd_vel: 1.0
      cross_track_error: 1.0
      heading_error: 1.0
      remaining_distance: 0.25
      goal_heading: 1.0
      dof_pos: 1.0
      dof_vel: 0.05
  terrain:
    mode: rough
    enabled: true
    size: [50.0, 50.0]
    resolution: [100, 100]
    height_range: [-2.0, 2.0]
    num_functions: 8
    uv_scale: 25.0
    flat_radius: 5.0
    seed: null
    rough:
      n_subterrains: [5, 5]
      subterrain_size: [10.0, 10.0]
      horizontal_scale: 0.25
      vertical_scale: 0.005
      uv_scale: 25.0
      randomize: false
      subterrain_types:
        - [flat_terrain, random_uniform_terrain, pyramid_sloped_terrain, discrete_obstacles_terrain, wave_terrain]
        - [pyramid_sloped_terrain, discrete_obstacles_terrain, wave_terrain, random_uniform_terrain, pyramid_stairs_terrain]
        - [random_uniform_terrain, pyramid_stairs_terrain, pyramid_sloped_terrain, flat_terrain, random_uniform_terrain]
        - [wave_terrain, random_uniform_terrain, discrete_obstacles_terrain, pyramid_sloped_terrain, wave_terrain]
        - [pyramid_stairs_terrain, flat_terrain, wave_terrain, discrete_obstacles_terrain, pyramid_sloped_terrain]
      subterrain_parameters:
        random_uniform_terrain:
          min_height: -0.12
          max_height: 0.12
          step: 0.1
        discrete_obstacles_terrain:
          max_height: 0.08
          min_size: 1.0
          max_size: 5.0
          num_rects: 28
        wave_terrain:
          num_waves: 2.5
          amplitude: 0.12
        pyramid_stairs_terrain:
          step_width: 0.75
          step_height: -0.12
    curriculum:
      enabled: false
  goal:
    spawn_margin_m: 6.0
    min_distance_m: 8.0
    max_distance_m: 24.0
    marker_radius_m: 0.12
    curriculum:
      enabled: true
      stage_steps: [0, 2000000, 6000000, 12000000, 20000000]
      stage_1:
        min_distance_m: 2.0
        max_distance_m: 6.0
      stage_2:
        min_distance_m: 4.0
        max_distance_m: 12.0
      stage_3:
        min_distance_m: 6.0
        max_distance_m: 18.0
      stage_4:
        min_distance_m: 8.0
        max_distance_m: 24.0
  bezier:
    num_samples: 96
    handle_ratio: 0.33
    handle_min_m: 0.50
    handle_max_m: 4.00
    lookahead_m: 1.00
    target_speed_mps: 0.70
    decel_radius_m: 4.00
    stop_radius_m: 0.80
    yaw_kp: 2.00
    yaw_rate_max: 1.50
    a_lat_max_mps2: 1.35
    curvature_eps: 1.0e-4
    corridor_reward_m: 0.75
    max_deviation_m: 2.50
    approach_radius_m: 1.00
    success_radius_m: 0.25
    success_yaw_deg: 180.0
    success_speed_mps: 1.50
    success_yaw_rate_rad_s: 3.00
    hold_steps: 1
    stagnation_progress_eps: 0.0035
    stagnation_consistent_progress_eps: 0.0015
    stagnation_steps_limit: 90
    stagnation_min_remaining_m: 0.75
    stagnation_residual_speed_mps: 0.10
    stagnation_uphill_slope_deg: 2.0
    stagnation_recovery_steps: 1
  sensors:
    imu:
      enabled: true
      magnetic_field: [1.0, 0.0, 0.0]
      acc_noise: [0.0, 0.0, 0.0]
      gyro_noise: [0.0, 0.0, 0.0]
      mag_noise: [0.0, 0.0, 0.0]
      acc_random_walk: [0.0, 0.0, 0.0]
      gyro_random_walk: [0.0, 0.0, 0.0]
      mag_random_walk: [0.0, 0.0, 0.0]
      delay: 0.0
      jitter: 0.0
      interpolate: false
      draw_debug: false
    feet:
      enabled: true
      contact_force_threshold: 5.0
      impact_force_threshold: 120.0
      min_force: 0.0
      max_force: [200.0, 200.0, 200.0]
      noise: [0.0, 0.0, 0.0]
      bias: [0.0, 0.0, 0.0]
      random_walk: [0.0, 0.0, 0.0]
      delay: 0.0
      jitter: 0.0
      interpolate: false
      draw_debug: false
    lidar:
      enabled: false
      horizontal_fov_deg: [-180.0, 180.0]
      vertical_fov_deg: [0.0, 90.0]
      n_points: [72, 6]
      bins_azimuth: 24
      bins_elevation: 3
      min_range: 0.05
      max_range: 30.0
      no_hit_value: 30.0
      ray_start_offset_m: 0.06
      enable_noise: false
      noise_std: 0.0
      draw_debug: false
    camera:
      enabled: false
      link: front_camera
      pos_offset: [0.32715, -0.00003, 0.04297]
      euler_offset: [0.0, 0.0, 0.0]
  rewards:
    only_positive_rewards: false
    base_height_target: 0.30
    base_height_tolerance: 0.035
    tracking_sigma: 0.25
    goal_yaw_sigma: 0.15
    stop_lin_sigma: 0.05
    stop_yaw_sigma: 0.08
    moving_threshold_mps: 0.15
    turn_in_place_speed_threshold: 0.15
    turn_in_place_cmd_threshold: 0.10
    turn_in_place_yaw_rate_rad_s: 0.35
    airtime_speed_threshold: 0.18
    airtime_cap_s: 0.18
    slope_sample_distance_m: 0.22
    climbable_slope_deg_min: 3.0
    climbable_slope_deg_max: 16.0
    curve_progress_heading_soft_min_cos: -0.20
    curve_progress_heading_full_cos: 0.85
    curve_progress_heading_min_gate: 0.20
    orientation_slope_relief: 0.35
    base_height_slope_relief: 0.45
    similar_to_default_slope_relief: 0.12
    upward_vel_slope_relief: 0.08
    lin_vel_z_slope_relief: 0.08
    dense_scales:
      tracking_lin_vel: 1.50
      tracking_ang_vel: 0.75
      curve_progress: 8.00
      cross_track: -1.50
      heading_alignment: 0.40
      reverse_vel: -2.00
      lateral_vel: -1.00
      upward_vel: -2.00
      flight_phase: -1.00
      orientation: -1.00
      base_height: -5.00
      lin_vel_z: -1.50
      ang_vel_xy: -0.05
      action_rate: -0.01
      joint_torque: -1.0e-5
      dof_acc: -2.5e-7
      similar_to_default: -0.05
      feet_air_time: 0.20
      trot_contact: 0.30
      goal_heading_track: 1.00
      hold_still: 2.00
    terminal_scales:
      success: 50.0
      fall: -10.0
      curve_deviation: -5.0
      stagnation: -3.0
    caps:
      base_height: 0.75
      orientation: 0.50
      cross_track: 0.50
      action_rate: 0.25
      reverse_vel: 0.40
      lateral_vel: 0.40
      upward_vel: 0.40
    curriculum:
      enabled: true
      stage_steps: [0, 3000000, 8000000]
      stage_1:
        tracking_lin_vel: 1
        tracking_ang_vel: 1
        curve_progress: 1
        cross_track: 1
        heading_alignment: 1
        orientation: 1
        base_height: 1
        lin_vel_z: 1
        ang_vel_xy: 1
        action_rate: 1
        joint_torque: 1
        dof_acc: 1
        similar_to_default: 1
        fall: 1
        curve_deviation: 1
        stagnation: 1
      stage_2:
        reverse_vel: 1
        lateral_vel: 1
        upward_vel: 1
        flight_phase: 1
        feet_air_time: 1
        trot_contact: 1
      stage_3:
        goal_heading_track: 1
        hold_still: 1
        success: 1
  termination:
    episode_length_s: 22.0
    posture_soft_roll_deg: 32.0
    posture_soft_pitch_deg: 32.0
    roll_deg: 55.0
    pitch_deg: 55.0
    bad_posture_patience: 18
    critical_posture_patience: 5
    fall_base_height_threshold: 0.14
evaluation:
  task_score_mode: article
  scientific_gates:
    enabled: true
    success_rate_min: 0.75
    max_final_distance_m: 0.40
    max_final_heading_error_deg: 14.0
    max_final_planar_speed_mps: 0.20
    max_final_yaw_rate_deg_s: 14.0
    max_fall_rate: 0.05
    max_timeout_rate: 0.18
    max_curve_deviation_rate: 0.12
    max_stagnation_rate: 0.12
    max_reverse_motion_ratio: 0.22
    max_lateral_motion_ratio: 0.40
    max_airborne_ratio: 0.15
training:
  total_timesteps: 50000000
  train_num_envs: 1024
  eval_num_envs: 32
  checkpoint_freq_env_steps: 50000
  eval_freq_env_steps: 100000
  n_eval_episodes: 10
  deterministic_eval: true
  verbose: 1
  normalization:
    enabled: true
    norm_obs: true
    norm_reward: true
    clip_obs: 10.0
    clip_reward: 10.0
    gamma: 0.99
    epsilon: 1.0e-8
  early_stopping:
    enabled: false
    max_no_improvement_evals: 10
    min_evals: 10
visualization:
  default_episodes: 1
  default_max_steps: 2000
  record_video: false
  video_camera:
    offset: [-1.6, -0.45, 0.45]
    lookat_offset: [0.2, 0.0, 0.0]
    fov: 55
    follow_robot: true
    follow_smoothing: 0.92
optuna:
  search_space:
    rewards.dense_scales.curve_progress:
      type: float
      low: 6.0
      high: 10.0
      step: 1.0
      phase: locomotion
    rewards.dense_scales.cross_track:
      type: float
      low: -2.0
      high: -0.5
      step: 0.25
      phase: locomotion
    rewards.dense_scales.reverse_vel:
      type: float
      low: -3.0
      high: -1.0
      step: 0.25
      phase: locomotion
    rewards.dense_scales.goal_heading_track:
      type: float
      low: 0.5
      high: 1.5
      step: 0.25
      phase: goal_stop
    rewards.dense_scales.hold_still:
      type: float
      low: 1.0
      high: 3.0
      step: 0.25
      phase: goal_stop
    bezier.target_speed_mps:
      type: float
      low: 0.7
      high: 1.1
      step: 0.1
      phase: locomotion
    bezier.decel_radius_m:
      type: float
      low: 1.5
      high: 2.8
      step: 0.25
      phase: goal_stop
