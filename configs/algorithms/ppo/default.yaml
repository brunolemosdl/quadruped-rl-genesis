algorithm:
  name: ppo
  library: stable_baselines3
  policy: MlpPolicy
  model_kwargs:
    learning_rate: 0.0003
    n_steps: 48
    batch_size: 4096
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5
  policy_kwargs:
    activation_fn: elu
    log_std_init: 0.0
    ortho_init: false
    net_arch:
      pi: [512, 256, 128]
      vf: [512, 256, 128]
optuna:
  search_space:
    algorithm.model_kwargs.learning_rate:
      type: float
      low: 0.0001
      high: 0.0005
      log: true
    algorithm.model_kwargs.n_steps:
      type: categorical
      choices: [48, 64, 96]
    algorithm.model_kwargs.batch_size:
      type: categorical
      choices: [4096, 8192]
    algorithm.model_kwargs.n_epochs:
      type: categorical
      choices: [8, 10, 12]
    algorithm.model_kwargs.clip_range:
      type: float
      low: 0.15
      high: 0.25
    algorithm.model_kwargs.ent_coef:
      type: float
      low: 0.005
      high: 0.03
      log: true
    algorithm.model_kwargs.vf_coef:
      type: float
      low: 0.4
      high: 0.8
    algorithm.model_kwargs.max_grad_norm:
      type: categorical
      choices: [0.5, 0.7, 1.0]
    algorithm.policy_kwargs.activation_fn:
      type: categorical
      choices: [elu, tanh]
